name: Publish Codes Snapshot

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codes-snapshot
  cancel-in-progress: true

env:
  CODES_API_URL: https://codes-backend.wwmcodes.workers.dev/v1/codes
  REQUEST_TIMEOUT_SECONDS: "20"

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Fetch snapshot
        run: |
          python -m wwm_codebot.snapshot_cli \
            --api-url "${CODES_API_URL}" \
            --output snapshot/codes_snapshot.json \
            --timeout "${REQUEST_TIMEOUT_SECONDS}"

      - name: Publish snapshot branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./snapshot
          publish_branch: snapshot-cache
          force_orphan: true

